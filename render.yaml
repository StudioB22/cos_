services:
  - type: web
    name: cos-old-school-api
    runtime: node
    rootDir: .
    buildCommand: pnpm install --frozen-lockfile=false && pnpm --filter @cos/api build
    startCommand: pnpm --filter @cos/api start
    envVars:
      - key: API_PORT
        value: 10000
      - key: SQLITE_PATH
        value: ./apps/api/data/cos.sqlite
      - key: COOKIE_SECRET
        sync: false
      - key: ALLOWED_ORIGIN
        sync: false
