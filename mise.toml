# Local CI toolchain (#2, skill local-ci): every CLI the justfile tiers and the lefthook hooks call,
# pinned; `mise.lock` pins the checksums. `just setup` installs it. Run the tiers as
# `mise x -- just <tier>` when the shell does not activate mise (the git hooks do). Outside mise:
# docker (the API image), ssh-keygen (attestation), sonar-scanner (skill infra-accounts) and
# Semgrep (`uvx semgrep@…` in the justfile: a mise pipx install needs a mise-managed Python).
#
# Node matches .nvmrc (22.23.4); pnpm comes from corepack (package.json
# packageManager): a global mise shim resolving another Node would run the suites on a version
# nothing else tests.
[tools]
node = "22.23.4"
just = "1.59.0"
lefthook = "2.2.2"
typos = "1.52.0"
hadolint = "2.15.1"
gitleaks = "8.30.1"
trufflehog = "3.99.8"
osv-scanner = "2.7.1"  # pnpm-lock.yaml
trivy = "0.76.2"       # compose and Dockerfile configuration, the API image (just gate)
uv = "0.13.7"          # Semgrep Community Edition via `uvx semgrep@…`

[settings]
lockfile = true
