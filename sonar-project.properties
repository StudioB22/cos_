sonar.projectKey=cos_
sonar.projectName=COS_ - Chat Old School
# The self-hosted instance (skill infra-accounts); the scanner otherwise defaults to SonarCloud (403).
sonar.host.url=http://localhost:9000
sonar.sources=apps/api/src,apps/web/src,packages/shared/src
sonar.tests=apps/api/test,apps/web/src
sonar.test.inclusions=apps/api/test/**,apps/web/src/**/*.test.ts,apps/web/src/**/*.e2e.ts
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,apps/web/src/**/*.test.ts,apps/web/src/**/*.e2e.ts
sonar.sourceEncoding=UTF-8
sonar.javascript.lcov.reportPaths=coverage/api/lcov.info,coverage/web/lcov.info
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
